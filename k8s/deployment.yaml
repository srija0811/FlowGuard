
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flowguard
  template:
    metadata:
      labels:
        app: flowguard
    spec:
      containers:
        - name: flowguard
          image: flowguard:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8088
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: flowguard-service
spec:
  type: NodePort
  selector:
    app: flowguard
  ports:
    - port: 8088
      targetPort: 8088
      nodePort: 30088
