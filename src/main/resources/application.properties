# Application name
spring.application.name=FlowGuard

# Server port (change if 8080 is already in use on your machine)
server.port=8088

# ─── Spring Boot Actuator ────────────────────────────────────────────────────
# Expose all actuator endpoints over HTTP (health, info, metrics, etc.)
management.endpoints.web.exposure.include=health,info,metrics,env
# Show full health detail (UP/DOWN with component breakdown)
management.endpoint.health.show-details=always
# Actuator base path (access endpoints at /actuator/health, /actuator/info, etc.)
management.endpoints.web.base-path=/actuator
# Application version info shown at /actuator/info
info.app.name=FlowGuard
info.app.description=College DevOps Dashboard Project
info.app.version=1.0.0

