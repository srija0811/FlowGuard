
# Application name
spring.application.name=FlowGuard

# Server port
server.port=8088

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics,env,prometheus

# Show detailed application health status
management.endpoint.health.show-details=always

# Actuator base path
management.endpoints.web.base-path=/actuator

# Application information
info.app.name=FlowGuard
info.app.description=College DevOps Dashboard Project
info.app.version=1.0.0
